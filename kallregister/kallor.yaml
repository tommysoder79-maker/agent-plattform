# Källregistret: det som skillsens val och regler vilar på.
#
# niva     1 = specifikation eller standardorgan, 2 = leverantörens egen text,
#            3 = sekundärkälla (bara pekare, får aldrig bära ett beslut)
# lasniva  original | extraktion | andra-hand | ej-last  (som i skillen registrera-kalla:
#            extraktion = läst via sökträffar, WebFetch eller utdrag)
# verifierad  datum då påståendet i "galler" senast kontrollerades mot källan; null = aldrig
# bar_beslut  får källan ensam bära ett beslut? Kräver nivå 1–2 och läsnivå original eller extraktion.
#
# scripts/kontrollera_kallor.py varnar när en källa som bär beslut inte verifierats på 90 dagar.
schema_version: 1
kallor:
