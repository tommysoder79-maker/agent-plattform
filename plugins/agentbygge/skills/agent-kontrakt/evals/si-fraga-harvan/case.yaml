schema_version: '1.1'
name: si-fraga-harvan
expected_outcome: |
  Som ett kontrakt blir Fråga härvan nivå 3: opålitliga observationer, organisationens material och svar som modellen formar och som går till en extern klient. Skillen delar upp den i två kontrakt: appens svar (A och B, nivå 2) och dörren för externa klienter begränsad till G (A och C, nivå 2). Sammanfattningen påpekar att OAuth-klienter i dag får organisationens material utanför plattformen.
